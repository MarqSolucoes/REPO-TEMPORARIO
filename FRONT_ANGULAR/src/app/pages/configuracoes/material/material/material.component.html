<div class="material-page">
  <app-loader [active]="isLoading"></app-loader>
  <h1 class="page-title">Materiais / Serviços</h1>
  <app-widget>
    <div class="row mb-3">
      <div class="col-auto ml-auto">
        <button *ngIf="usuarioDTO?.materialCadastrar" class="btn btn-outline-success" (click)="openNovo()">Novo Material</button>
      </div>
    </div>
    <div class="table-card">
      <table class="estilo-tabela">
        <thead>
          <tr>
            <th class="estilo-cabecalho">Descrição</th>
            <th class="estilo-cabecalho">Unidade</th>
            <th class="estilo-cabecalho texto-centro">Status</th>
            <th class="estilo-cabecalho texto-centro">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of materiais; trackBy: trackByIndex">
            <td class="estilo-celula">{{ row.descricao }}</td>
            <td class="estilo-celula">{{ row.unidadeMaterial ? row.unidadeMaterial.codigo : '' }}</td>
            <td class="estilo-celula texto-centro">{{ row.ativo ? 'Ativo' : 'Inativo' }}</td>
            <td class="estilo-celula texto-centro">
              <button *ngIf="row.ativo && usuarioDTO?.materialAtivarDesativar" class="btn btn-sm btn-outline-danger mr-1" (click)="ativarDesativar(row.id, row.ativo)">Desativar</button>
              <button *ngIf="!row.ativo && usuarioDTO?.materialAtivarDesativar" class="btn btn-sm btn-outline-success mr-1" (click)="ativarDesativar(row.id, row.ativo)">Ativar</button>
              <button *ngIf="usuarioDTO?.materialEditar" class="btn btn-sm btn-outline-info" (click)="openEdit(row)">Editar</button>
            </td>
          </tr>
          <tr *ngIf="!materiais || materiais.length === 0">
            <td class="estilo-celula texto-centro" colspan="4">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-widget>

  <div class="modal" [style.display]="modal_Exibir ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ modal_Titulo }}</h5>
          <button type="button" class="close" (click)="modal_Exibir = false"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="form-group"><label>Descrição</label><input type="text" class="form-control" [(ngModel)]="material_Descricao" /></div>
          <div class="form-group">
            <label>Categoria</label>
            <select class="form-control" [(ngModel)]="material_IdCategoriaMaterial">
              <option [value]="0">Selecione...</option>
              <option *ngFor="let c of categorias" [value]="c.id">{{ c.descricao }}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Unidade</label>
            <select class="form-control" [(ngModel)]="material_IdUnidadeMaterial">
              <option [value]="0">Selecione...</option>
              <option *ngFor="let u of unidades" [value]="u.id">{{ u.descricao }}</option>
            </select>
          </div>
          <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="material_Servico" [(ngModel)]="material_Servico" />
            <label class="form-check-label" for="material_Servico">Serviço</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark" (click)="modal_Exibir = false">Cancelar</button>
          <button class="btn btn-success" (click)="salvar()" [disabled]="controle_Salvando">{{ controle_Salvando ? 'Aguarde...' : (modal_ExibirBotaoCadastrar ? 'Cadastrar' : 'Editar') }}</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="modal_Exibir"></div>
</div>
