<div class="obras-page">
  <app-loader [active]="isLoading"></app-loader>
  <h1 class="page-title">Obras</h1>
  <app-widget>
    <div class="row mb-3">
      <div class="col-auto ml-auto">
        <button *ngIf="usuarioDTO?.obraCadastrar" class="btn btn-outline-success" (click)="openNovo()">Nova Obra</button>
      </div>
    </div>
    <div class="table-card">
      <table class="estilo-tabela">
        <thead>
          <tr>
            <th class="estilo-cabecalho">Nome</th>
            <th class="estilo-cabecalho">Descrição</th>
            <th class="estilo-cabecalho texto-centro">Status</th>
            <th class="estilo-cabecalho texto-centro">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of obras; trackBy: trackByIndex">
            <td class="estilo-celula">{{ row.nome }}</td>
            <td class="estilo-celula">{{ row.descricao }}</td>
            <td class="estilo-celula texto-centro">{{ row.status }}</td>
            <td class="estilo-celula texto-centro">
              <button class="btn btn-sm btn-outline-info" (click)="verDetalhe(row.id)">Detalhe</button>
            </td>
          </tr>
          <tr *ngIf="!obras || obras.length === 0">
            <td class="estilo-celula texto-centro" colspan="4">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-widget>

  <div class="modal" [style.display]="modal_Exibir ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">{{ modal_Titulo }}</h5></div>
        <div class="modal-body">
          <div class="form-group"><label>Nome</label><input type="text" class="form-control" [(ngModel)]="obra_Nome" /></div>
          <div class="form-group"><label>Descrição</label><textarea class="form-control" [(ngModel)]="obra_Descricao"></textarea></div>
          <div class="form-group">
            <label>Cliente</label>
            <select class="form-control" [(ngModel)]="obra_ClienteId">
              <option [value]="0">Selecione...</option>
              <option *ngFor="let c of clientes" [value]="c.id">{{ c.razaoSocial || c.nomeFantasia }}</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark" (click)="modal_Exibir = false">Cancelar</button>
          <button class="btn btn-success" (click)="salvar()" [disabled]="controle_Salvando">{{ controle_Salvando ? 'Aguarde...' : 'Cadastrar' }}</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="modal_Exibir"></div>
</div>
