<div class="page"><h1>Configurações / Material</h1><p *ngIf="isLoading">Carregando...</p><p class="error" *ngIf="error">{{error}}</p><form [formGroup]="form" (ngSubmit)="salvar()"><input formControlName="nome"/><button type="submit">{{editId?'Atualizar':'Cadastrar'}}</button><button type="button" (click)="novo()">Novo</button></form><ul><li *ngFor="let x of itens">{{x.id}} - {{x.nome}} <button type="button" (click)="editar(x)">Editar</button></li></ul></div>
