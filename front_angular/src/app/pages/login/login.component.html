<section class="login-page">
  <h1>Login</h1>
  <form [formGroup]="loginForm" (ngSubmit)="entrar()">
    <label>Usuário <input type="text" formControlName="usuario" /></label>
    <label>Senha <input type="password" formControlName="senha" /></label>
    <button type="submit">{{ isFetching ? 'Loading...' : 'Acessar' }}</button>
  </form>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</section>
