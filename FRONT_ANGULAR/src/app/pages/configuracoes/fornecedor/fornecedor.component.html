<div class="fornecedor-page">
  <app-loader [active]="isLoading"></app-loader>
  <h1 class="page-title">Fornecedores</h1>
  <app-widget>
    <div class="row mb-3">
      <div class="col-auto ml-auto">
        <button *ngIf="usuarioDTO?.fornecedorCadastrar" class="btn btn-outline-success" (click)="openNovo()">Novo Fornecedor</button>
      </div>
    </div>
    <div class="table-card">
      <table class="estilo-tabela">
        <thead>
          <tr>
            <th class="estilo-cabecalho">Nome / Razão Social</th>
            <th class="estilo-cabecalho">CNPJ / CPF</th>
            <th class="estilo-cabecalho">E-mail</th>
            <th class="estilo-cabecalho texto-centro">Status</th>
            <th class="estilo-cabecalho texto-centro">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of fornecedores; trackBy: trackByIndex">
            <td class="estilo-celula">{{ row.razaoSocial || row.nome }}</td>
            <td class="estilo-celula">{{ row.cnpj || row.cpf }}</td>
            <td class="estilo-celula">{{ row.email }}</td>
            <td class="estilo-celula texto-centro">{{ row.ativo ? 'Ativo' : 'Inativo' }}</td>
            <td class="estilo-celula texto-centro">
              <button *ngIf="row.ativo && usuarioDTO?.fornecedorAtivarDesativar" class="btn btn-sm btn-outline-danger mr-1" (click)="ativarDesativar(row.id, row.ativo)">Desativar</button>
              <button *ngIf="!row.ativo && usuarioDTO?.fornecedorAtivarDesativar" class="btn btn-sm btn-outline-success mr-1" (click)="ativarDesativar(row.id, row.ativo)">Ativar</button>
              <button *ngIf="usuarioDTO?.fornecedorEditar" class="btn btn-sm btn-outline-info" (click)="openEdit(row)">Editar</button>
            </td>
          </tr>
          <tr *ngIf="!fornecedores || fornecedores.length === 0">
            <td class="estilo-celula texto-centro" colspan="5">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-widget>

  <div class="modal" [style.display]="modal_Exibir ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ modal_Titulo }}</h5>
          <button type="button" class="close" (click)="modal_Exibir = false"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Tipo</label>
            <select class="form-control" [(ngModel)]="fornecedor_IdTipoFornecedor">
              <option [value]="1">Pessoa Física</option>
              <option [value]="2">Pessoa Jurídica</option>
            </select>
          </div>
          <!-- Pessoa Jurídica -->
          <ng-container *ngIf="fornecedor_IdTipoFornecedor === 2">
            <div class="form-group"><label>Razão Social</label><input type="text" class="form-control" [(ngModel)]="fornecedor_RazaoSocial" /></div>
            <div class="form-group"><label>Nome Fantasia</label><input type="text" class="form-control" [(ngModel)]="fornecedor_NomeFantasia" /></div>
            <div class="form-group"><label>CNPJ</label><input type="text" class="form-control" [(ngModel)]="fornecedor_CNPJ" /></div>
            <div class="form-group"><label>Inscrição Estadual</label><input type="text" class="form-control" [(ngModel)]="fornecedor_InscricaoEstadual" /></div>
          </ng-container>
          <!-- Pessoa Física -->
          <ng-container *ngIf="fornecedor_IdTipoFornecedor === 1">
            <div class="form-group"><label>Nome</label><input type="text" class="form-control" [(ngModel)]="fornecedor_Nome" /></div>
            <div class="form-group"><label>CPF</label><input type="text" class="form-control" [(ngModel)]="fornecedor_CPF" /></div>
          </ng-container>
          <!-- Comum -->
          <div class="form-group"><label>Número Cadastral</label><input type="text" class="form-control" [(ngModel)]="fornecedor_NumeroCadastral" /></div>
          <div class="form-group"><label>E-mail</label><input type="email" class="form-control" [(ngModel)]="fornecedor_Email" /></div>
          <div class="form-group"><label>Nome do Vendedor</label><input type="text" class="form-control" [(ngModel)]="fornecedor_NomeVendedor" /></div>
          <div class="form-group"><label>Telefone Celular</label><input type="text" class="form-control" [(ngModel)]="fornecedor_TelefoneCelular" /></div>
          <div class="form-group"><label>Telefone Fixo</label><input type="text" class="form-control" [(ngModel)]="fornecedor_TelefoneFixo" /></div>
          <div class="form-group"><label>CEP</label><input type="text" class="form-control" [(ngModel)]="fornecedor_CEP" /></div>
          <div class="form-group"><label>Endereço</label><input type="text" class="form-control" [(ngModel)]="fornecedor_Endereco" /></div>
          <div class="form-group"><label>Bairro</label><input type="text" class="form-control" [(ngModel)]="fornecedor_Bairro" /></div>
          <div class="form-group"><label>Observação</label><textarea class="form-control" [(ngModel)]="fornecedor_Observacao"></textarea></div>
          <div class="form-group">
            <label>Cidade</label>
            <select class="form-control" [(ngModel)]="fornecedor_IdCidade">
              <option [value]="0">Selecione...</option>
              <option *ngFor="let c of cidades" [value]="c.id">{{ c.nome }}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Condição de Pagamento</label>
            <select class="form-control" [(ngModel)]="fornecedor_IdCondicaoPagamento">
              <option [value]="0">Selecione...</option>
              <option *ngFor="let cp of condicoesPagamento" [value]="cp.id">{{ cp.descricao }}</option>
            </select>
          </div>
          <div class="form-group"><label>Banco</label><input type="text" class="form-control" [(ngModel)]="fornecedor_Banco" /></div>
          <div class="form-group"><label>Agência</label><input type="text" class="form-control" [(ngModel)]="fornecedor_Agencia" /></div>
          <div class="form-group"><label>Conta</label><input type="text" class="form-control" [(ngModel)]="fornecedor_Conta" /></div>
          <div class="form-group"><label>Tipo de Conta</label><input type="text" class="form-control" [(ngModel)]="fornecedor_TipoConta" /></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark" (click)="modal_Exibir = false">Cancelar</button>
          <button class="btn btn-success" (click)="salvar()" [disabled]="controle_Salvando">{{ controle_Salvando ? 'Aguarde...' : (modal_ExibirBotaoCadastrar ? 'Cadastrar' : 'Editar') }}</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="modal_Exibir"></div>
</div>
