<div class="eto-page">
  <app-loader [active]="isLoading"></app-loader>
  <h1 class="page-title">ETO - AJUSTE</h1>

  <app-widget>
    <div class="mb-3">
      <input type="file" #fileInput style="display:none" (change)="onFileChange($event)" accept=".xlsx,.xls">
      <button class="btn btn-success mr-2" (click)="downloadExcel()">
        <i class="fa fa-download mr-1"></i> Download Excel de ETOs
      </button>
      <button class="btn btn-warning" (click)="fileInput.click()">
        <i class="fa fa-upload mr-1"></i> Upload Excel de ETOs
      </button>
    </div>
  </app-widget>

  <app-widget>
    <div class="table-card">
      <table class="estilo-tabela">
        <thead>
          <tr>
            <th class="estilo-cabecalho">Usuário</th>
            <th class="estilo-cabecalho texto-centro">Data Atualização</th>
            <th class="estilo-cabecalho texto-centro">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of ajustes; trackBy: trackByIndex">
            <td class="estilo-celula">{{ row.usuario ? row.usuario.nome : '' }}</td>
            <td class="estilo-celula texto-centro">{{ formataData(row.dataCadastro) }}</td>
            <td class="estilo-celula texto-centro">
              <button class="btn btn-primary btn-sm" (click)="downloadArquivo(row.id, 1)">
                <i class="fa fa-download mr-1"></i> Arquivo Enviado
              </button>
            </td>
          </tr>
          <tr *ngIf="!ajustes || ajustes.length === 0">
            <td class="estilo-celula texto-centro" colspan="3">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-widget>
</div>
