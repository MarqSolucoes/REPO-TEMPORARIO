<div class="cliente-page">
  <app-loader [active]="isLoading"></app-loader>
  <h1 class="page-title">Clientes</h1>
  <app-widget>
    <div class="row mb-3">
      <div class="col-auto ml-auto">
        <button *ngIf="usuarioDTO?.clienteCadastrar" class="btn btn-outline-success" (click)="openNovo()">Novo Cliente</button>
      </div>
    </div>
    <div class="table-card">
      <table class="estilo-tabela">
        <thead>
          <tr>
            <th class="estilo-cabecalho">Razão Social</th>
            <th class="estilo-cabecalho">Nome Fantasia</th>
            <th class="estilo-cabecalho">CNPJ</th>
            <th class="estilo-cabecalho">E-mail Financeiro</th>
            <th class="estilo-cabecalho texto-centro">Status</th>
            <th class="estilo-cabecalho texto-centro">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of clientes; trackBy: trackByIndex">
            <td class="estilo-celula">{{ row.razaoSocial }}</td>
            <td class="estilo-celula">{{ row.nomeFantasia }}</td>
            <td class="estilo-celula">{{ row.cnpj }}</td>
            <td class="estilo-celula">{{ row.emailFinanceiro }}</td>
            <td class="estilo-celula texto-centro">{{ row.ativo ? 'Ativo' : 'Inativo' }}</td>
            <td class="estilo-celula texto-centro">
              <button *ngIf="row.ativo && usuarioDTO?.clienteAtivarDesativar" class="btn btn-sm btn-outline-danger mr-1" (click)="ativarDesativar(row.id, row.ativo)">Desativar</button>
              <button *ngIf="!row.ativo && usuarioDTO?.clienteAtivarDesativar" class="btn btn-sm btn-outline-success mr-1" (click)="ativarDesativar(row.id, row.ativo)">Ativar</button>
              <button *ngIf="usuarioDTO?.clienteEditar" class="btn btn-sm btn-outline-info" (click)="openEdit(row)">Editar</button>
            </td>
          </tr>
          <tr *ngIf="!clientes || clientes.length === 0">
            <td class="estilo-celula texto-centro" colspan="6">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-widget>

  <div class="modal" [style.display]="modal_Exibir ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ modal_Titulo }}</h5>
          <button type="button" class="close" (click)="modal_Exibir = false"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Razão Social</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_RazaoSocial" />
          </div>
          <div class="form-group">
            <label>Nome Fantasia</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_NomeFantasia" />
          </div>
          <div class="form-group">
            <label>CNPJ</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_CNPJ" />
          </div>
          <div class="form-group">
            <label>Inscrição Estadual</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_InscricaoEstadual" />
          </div>
          <div class="form-group">
            <label>E-mail Financeiro</label>
            <input type="email" class="form-control" [(ngModel)]="cliente_EmailFinanceiro" />
          </div>
          <div class="form-group">
            <label>E-mail Comercial</label>
            <input type="email" class="form-control" [(ngModel)]="cliente_EmailComercial" />
          </div>
          <div class="form-group">
            <label>Responsável Comercial</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_ResponsavelComercial" />
          </div>
          <div class="form-group">
            <label>Telefone Celular</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_TelefoneCelular" />
          </div>
          <div class="form-group">
            <label>Telefone Fixo</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_TelefoneFixo" />
          </div>
          <div class="form-group">
            <label>Dias de Pagamento</label>
            <input type="number" class="form-control" [(ngModel)]="cliente_DiasDePagamento" />
          </div>
          <div class="form-group">
            <label>CEP</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_CEP" />
          </div>
          <div class="form-group">
            <label>Endereço</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_Endereco" />
          </div>
          <div class="form-group">
            <label>Bairro</label>
            <input type="text" class="form-control" [(ngModel)]="cliente_Bairro" />
          </div>
          <div class="form-group">
            <label>Observação</label>
            <textarea class="form-control" [(ngModel)]="cliente_Observacao"></textarea>
          </div>
          <div class="form-group">
            <label>Cidade</label>
            <select class="form-control" [(ngModel)]="cliente_IdCidade">
              <option [value]="0">Selecione...</option>
              <option *ngFor="let c of cidades" [value]="c.id">{{ c.nome }}</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark" (click)="modal_Exibir = false">Cancelar</button>
          <button class="btn btn-success" (click)="salvar()" [disabled]="controle_Salvando">
            {{ controle_Salvando ? 'Aguarde...' : (modal_ExibirBotaoCadastrar ? 'Cadastrar' : 'Editar') }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="modal_Exibir"></div>
</div>
