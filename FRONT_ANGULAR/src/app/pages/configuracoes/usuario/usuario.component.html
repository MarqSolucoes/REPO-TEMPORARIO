<div class="usuario-page">
  <app-loader [active]="isLoading"></app-loader>
  <h1 class="page-title">Usuários</h1>
  <app-widget>
    <div class="row mb-3">
      <div class="col-auto ml-auto">
        <button *ngIf="usuarioDTO?.usuarioCadastrar" class="btn btn-outline-success" (click)="openNovo()">Novo Usuário</button>
      </div>
    </div>
    <div class="table-card">
      <table class="estilo-tabela">
        <thead>
          <tr>
            <th class="estilo-cabecalho">Cargo</th>
            <th class="estilo-cabecalho">Nome</th>
            <th class="estilo-cabecalho">Login</th>
            <th class="estilo-cabecalho texto-centro">Login Habilitado</th>
            <th class="estilo-cabecalho texto-centro">Status</th>
            <th class="estilo-cabecalho texto-centro">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of usuarios; trackBy: trackByIndex">
            <td class="estilo-celula">{{ row.cargoUsuario ? row.cargoUsuario.descricao : '' }}</td>
            <td class="estilo-celula">{{ row.nome }}</td>
            <td class="estilo-celula">{{ row.login }}</td>
            <td class="estilo-celula texto-centro">{{ row.habilitaLogin ? 'Sim' : 'Não' }}</td>
            <td class="estilo-celula texto-centro">{{ row.ativo ? 'Ativo' : 'Inativo' }}</td>
            <td class="estilo-celula texto-centro">
              <button *ngIf="row.ativo && usuarioDTO?.usuarioAtivarDesativar" class="btn btn-sm btn-outline-danger mr-1" (click)="ativarDesativar(row.id, row.ativo)">Desativar</button>
              <button *ngIf="!row.ativo && usuarioDTO?.usuarioAtivarDesativar" class="btn btn-sm btn-outline-success mr-1" (click)="ativarDesativar(row.id, row.ativo)">Ativar</button>
              <button *ngIf="usuarioDTO?.usuarioEditar" class="btn btn-sm btn-outline-info" (click)="openEdit(row)">Editar</button>
            </td>
          </tr>
          <tr *ngIf="!usuarios || usuarios.length === 0">
            <td class="estilo-celula texto-centro" colspan="6">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-widget>

  <div class="modal" [style.display]="modal_Exibir ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">{{ modal_Titulo }}</h5></div>
        <div class="modal-body">
          <div class="form-group">
            <label>Cargo</label>
            <select class="form-control" [(ngModel)]="usuario_IdCargo">
              <option [value]="0">Selecione...</option>
              <option *ngFor="let c of cargos" [value]="c.id">{{ c.descricao }}</option>
            </select>
          </div>
          <div class="form-group"><label>Nome</label><input type="text" class="form-control" [(ngModel)]="usuario_Nome" /></div>
          <div class="form-group"><label>E-mail</label><input type="email" class="form-control" [(ngModel)]="usuario_Email" /></div>
          <div class="form-group"><label>Login</label><input type="text" class="form-control" [(ngModel)]="usuario_Login" /></div>
          <div class="form-group" *ngIf="modal_ExibirBotaoCadastrar"><label>Senha</label><input type="password" class="form-control" [(ngModel)]="usuario_Senha" /></div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="usuario_HabilitaLogin" [(ngModel)]="usuario_HabilitaLogin" />
            <label class="form-check-label" for="usuario_HabilitaLogin">Habilitar Login</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark" (click)="modal_Exibir = false">Cancelar</button>
          <button class="btn btn-success" (click)="salvar()" [disabled]="controle_Salvando">{{ controle_Salvando ? 'Aguarde...' : (modal_ExibirBotaoCadastrar ? 'Cadastrar' : 'Editar') }}</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="modal_Exibir"></div>
</div>
