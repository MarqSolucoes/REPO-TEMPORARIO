<div class="cargo-page">
  <app-loader [active]="isLoading"></app-loader>
  <h1 class="page-title">Cargos</h1>
  <app-widget>
    <div class="row mb-3">
      <div class="col-auto ml-auto">
        <button *ngIf="usuarioDTO?.cargoCadastrar" class="btn btn-outline-success" (click)="openNovo()">Novo Cargo</button>
      </div>
    </div>
    <div class="table-card">
      <table class="estilo-tabela">
        <thead>
          <tr>
            <th class="estilo-cabecalho">Descrição</th>
            <th class="estilo-cabecalho texto-centro">Status</th>
            <th class="estilo-cabecalho texto-centro">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of cargos; trackBy: trackByIndex">
            <td class="estilo-celula">{{ row.descricao }}</td>
            <td class="estilo-celula texto-centro">{{ row.ativoLabel }}</td>
            <td class="estilo-celula texto-centro">
              <button *ngIf="row.ativoLabel === 'Ativo' && usuarioDTO?.cargoAtivarDesativar" class="btn btn-sm btn-outline-danger mr-1" (click)="ativarDesativar(row.id, row.ativoLabel)">Desativar</button>
              <button *ngIf="row.ativoLabel === 'Inativo' && usuarioDTO?.cargoAtivarDesativar" class="btn btn-sm btn-outline-success" (click)="ativarDesativar(row.id, row.ativoLabel)">Ativar</button>
            </td>
          </tr>
          <tr *ngIf="!cargos || cargos.length === 0">
            <td class="estilo-celula texto-centro" colspan="3">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-widget>

  <div class="modal" [style.display]="modal_Exibir ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ modal_Titulo }}</h5>
          <button type="button" class="close" (click)="modal_Exibir = false"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Descrição</label>
            <input type="text" class="form-control" [(ngModel)]="cargo_Descricao" />
          </div>
          <div class="form-group">
            <label>Situação</label>
            <select class="form-control" [(ngModel)]="cargo_Ativo">
              <option [value]="true">Ativo</option>
              <option [value]="false">Inativo</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark" (click)="modal_Exibir = false">Cancelar</button>
          <button *ngIf="modal_ExibirBotaoCadastrar" class="btn btn-success" (click)="post()" [disabled]="controle_CargoCadastrando">
            <span *ngIf="controle_CargoCadastrando" class="spinner-border spinner-border-sm mr-1"></span>
            {{ controle_CargoCadastrando ? 'Aguarde...' : 'Cadastrar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="modal_Exibir"></div>
</div>
