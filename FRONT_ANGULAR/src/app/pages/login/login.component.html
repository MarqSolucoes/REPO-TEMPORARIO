<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4 mt-5">
        <div class="widget" style="background-color: white; padding: 2rem;">
          <div class="text-center mb-4">
            <img src="assets/logo-wh.png" alt="logo" width="150px" class="img-fluid" onerror="this.style.display='none'"/>
          </div>
          <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
          <form (ngSubmit)="login()">
            <div class="form-group">
              <label>Usuário</label>
              <input type="text" class="form-control" [(ngModel)]="usuario" name="usuario" required placeholder="Usuário" />
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" class="form-control" [(ngModel)]="senha" name="senha" required placeholder="Senha" />
            </div>
            <div class="text-right mt-3">
              <button type="submit" class="btn btn-primary">
                {{ isFetching ? 'Carregando...' : 'Acessar' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
